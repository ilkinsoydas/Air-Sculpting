<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D AI Showcase - GLB Loading</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; }
        #info { 
            position: absolute; top: 10px; left: 10px; 
            color: white; font-family: sans-serif; font-size: 22px; 
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="info">Loading Model...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 2.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        let activeModel = null;

        const loader = new THREE.GLTFLoader();

        let importantParts = [];
        
        loader.load('scene.gltf', function (gltf) {
            activeModel = gltf.scene;
            
            activeModel.scale.set(1, 1, 1); 
            activeModel.position.set(0, 0, 0);

            const box = new THREE.Box3().setFromObject(activeModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            console.log("Model Center: ", center);
            console.log("Model Size: ", size);

            activeModel.position.sub(center);
            scene.add(activeModel);

            const maxDim = Math.max(size.x, size.y, size.z);
            camera.position.set(0, maxDim * 1.5, 0);
            camera.lookAt(0, 0, 0);

            console.log("MAX DIM:", maxDim);
            console.log("CAMERA:", camera.position);
            console.log("MODEL SCALE:", activeModel.scale);
            console.log("MODEL POSITION:", activeModel.position);

            const partNames = [
                "CPU",
                "RAM",
                "RAM1",
                "RAM2",
                "RAM3",
                "M2"
            ];
            partNames.forEach((name) => {
                const part = activeModel.getObjectByName(name);
                if (part) {
                    part.userData.originalPosition = part.position.clone();
                    
                    const distance = maxDim * 10.0;

                    console.log(
                        "name:", name,
                        "position:", part.position,
                        "parent:", part.parent?.name
                    );

                    if (name == "CPU") {
                        part.userData.explodedPosition = part.position.clone();
                        part.userData.explodedPosition.y += distance;
                    }
                    else if (name == "RAM") {
                        part.userData.explodedPosition = part.position.clone();
                        part.userData.explodedPosition.x += distance;
                    }
                    else if(name == "RAM1") {
                        part.userData.explodedPosition = part.position.clone();
                        part.userData.explodedPosition.x -= distance;
                    }
                    else if(name == "RAM2") {
                        part.userData.explodedPosition = part.position.clone();
                        part.userData.explodedPosition.z += distance;
                    }
                    else if (name == "RAM3") {
                        part.userData.explodedPosition = part.position.clone();
                        part.userData.explodedPosition.z -= distance;
                    }
                    else if(name == "M2") {
                        part.userData.explodedPosition = part.position.clone();
                        part.userData.explodedPosition.y -= distance;
                    }

                    importantParts.push(part);
                    console.log(`Found part:`, name);
                }
                else {
                    console.warn(`Part not found:`, name);
                }

            });
        }, undefined, function (error) {
            console.error('An error occurred while loading the model:', error);
        });

        const targetQuaternion = new THREE.Quaternion();
        let targetPosX = 0;
        let targetPosY = 0;
        let targetScale = 1.0;

        let currentGesture = "None";
        let previousX = null;
        let previousY = null;

        const ws = new WebSocket("ws://127.0.0.1:8000/ws");
        const infoDiv = document.getElementById("info");

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data); 
            
            infoDiv.innerText = "Gesture: " + data.gesture + " | X: " + data.x.toFixed(2) + " | Y: " + data.y.toFixed(2);
            
            if (data.gesture === "Rotate") infoDiv.style.color = "#ffeb3b"; 
            else if (data.gesture === "Pinch") infoDiv.style.color = "#4caf50"; 
            else if (data.gesture === "Extrude") infoDiv.style.color = "#2196f3"; 
            else if (data.gesture == "Fist") infoDiv.style.color = "#9c27b0";
            else infoDiv.style.color = "white"; 

            if (currentGesture !== data.gesture) {
                previousX = null;
                previousY = null;
            }
            currentGesture = data.gesture;

            if (!data.gesture || currentGesture === "None") {
                previousX = null;
                previousY = null;
                return;
            }

            if (currentGesture === "Idle" || !data.gesture) {
                if (importantParts && importantParts.length > 0) {
                    importantParts.forEach(part => {
                        part.userData.targetPosition = part.userData.explodedPosition;
                    });
                }
                
                previousX = null;
                previousY = null;
                return; 
            }

            if (currentGesture === "Fist") {
                if (importantParts && importantParts.length > 0) {
                    importantParts.forEach(part => {
                        part.userData.targetPosition = part.userData.originalPosition;
                    });
                }
                previousX = null;
                previousY = null;
                return;
            }

            if (previousX === null || previousY === null) {
                previousX = data.x;
                previousY = data.y;
                return;
            }

            const deltaX = data.x - previousX;
            const deltaY = data.y - previousY;

            if (currentGesture === "Rotate") {
                let qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), deltaX * 4.0);
                let qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), deltaY * 4.0);
                targetQuaternion.premultiply(qX);
                targetQuaternion.premultiply(qY);
            } 
            else if (currentGesture === "Pinch") {
                targetPosX += deltaX * 15.0; 
                targetPosY -= deltaY * 15.0; 
            } 
            else if (currentGesture === "Extrude") {
                targetScale -= deltaY * 5.0; 
                if (targetScale > 2.5) targetScale = 2.5;
                if (targetScale < 0.3) targetScale = 0.3;
            }

            previousX = data.x;
            previousY = data.y;
        };

        function animate() {
            requestAnimationFrame(animate);

            if (activeModel) {
                activeModel.quaternion.slerp(targetQuaternion, 0.2);
                
                activeModel.position.x += (targetPosX - activeModel.position.x) * 0.2;
                activeModel.position.y += (targetPosY - activeModel.position.y) * 0.2;
                
                activeModel.scale.x += (targetScale - activeModel.scale.x) * 0.2;
                activeModel.scale.y += (targetScale - activeModel.scale.y) * 0.2;
                activeModel.scale.z += (targetScale - activeModel.scale.z) * 0.2;

                if (importantParts && importantParts.length > 0) {
                    importantParts.forEach(part => {
                        if (part.userData.targetPosition) {
                            part.position.lerp(part.userData.targetPosition, 0.2);
                        }
                    });
                }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
